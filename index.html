<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Generator Kalimat Promo + Lokasi + Excel Export</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 850px; margin: 20px auto; padding: 10px; }
  textarea { width: 100%; height: 110px; font-family: monospace; margin-bottom: 5px; }
  input, button { padding: 8px 14px; margin: 5px 5px 5px 0; cursor: pointer; }
  #hasil { width: 100%; height: 320px; }
  label { font-weight: bold; display: block; margin-top: 10px; }
  progress { width: 100%; height: 18px; margin: 8px 0; }
  .btn-ai { background: #6c5ce7; color: white; border: none; border-radius: 4px; }
  .btn-generate { background: #00b894; color: white; border: none; border-radius: 4px; }
  .btn-download { background: #0984e3; color: white; border: none; border-radius: 4px; }
  .btn-excel { background: #1d6f42; color: white; border: none; border-radius: 4px; }
  #statusText { font-size: 13px; color: #555; }
  .info-text { font-size: 12px; color: #888; font-weight: normal; }
</style>
</head>
<body>

<h2>Generator Kalimat Promo + Lokasi + Export Excel</h2>

<label>Nama Produk</label>
<input type="text" id="namaProduk" value="Susu Kambing" style="width:100%; box-sizing:border-box;">

<label>Bank Kata Pembuka</label>
<textarea id="pembuka">Ingin Lebih Sehat?
Yuk, Ikuti Sunnah Rosul!
Rasakan Khasiatnya!
Sudah Coba Yang Murni?
Jaga Imun Secara Alami!
Waktunya Hidup Berkualitas!
Bikin Tubuh Makin Bugar!
Warisan Nabi yang Menyehatkan!
Baru Kenal Manfaatnya?
Saatnya Rasakan Kesegarannya!</textarea>
<button class="btn-ai" onclick="rekomendasi('pembuka')">✨ Rekomendasi</button>

<label>Bank Kata Promo</label>
<textarea id="promo">Diskon 20%
Beli 2 Gratis 1
Cashback 15%
Harga Spesial Bulan Ini
Bonus Botol Kedua
Hemat Hingga 30 Ribu
Paket Hemat Keluarga
Voucher Belanja Rp10.000
Potongan Harga Member Baru
Bundling Hemat 2 Produk</textarea>
<button class="btn-ai" onclick="rekomendasi('promo')">✨ Rekomendasi</button>

<label>Bank Kata Closing <span class="info-text">(jangan sertakan nama produk)</span></label>
<textarea id="closing">Lagi Cari
Paket
Yang Jual
Order
Stok
Cari Yang Asli
Langganan
Info
Beli
Cek</textarea>
<button class="btn-ai" onclick="rekomendasi('closing')">✨ Rekomendasi</button>

<label>Kata Kunci Pendukung</label>
<textarea id="keywordMod">murni
asli
terbaik
berkualitas
alami
sehat
murah
original
terpercaya
segar</textarea>

<label>Bank Lokasi/Kota <span class="info-text">(otomatis digabung ke keyword & hashtag, tidak akan berulang dalam 1 kalimat)</span></label>
<textarea id="lokasi">Beji Kota Depok
Bojongsari Kota Depok
Cilodong Kota Depok
Cimanggis Kota Depok
Cinere Kota Depok
Cipayung Kota Depok
Limo Kota Depok
Pancoran Mas Kota Depok
Sawangan Kota Depok
Sukmajaya Kota Depok
Tapos Kota Depok</textarea>

<label>Nomor HP</label>
<input type="text" id="nomor" value="08141-3333-512">

<label>Jumlah Kalimat</label>
<input type="number" id="jumlah" value="20">

<br>
<button class="btn-generate" onclick="generate()">🚀 Generate</button>
<button class="btn-download" onclick="unduhTxt()">⬇ Download .txt</button>
<button class="btn-excel" onclick="unduhExcel()">📊 Download Excel (3 Kolom)</button>

<progress id="progressBar" value="0" max="100" style="display:none;"></progress>
<div id="statusText"></div>

<h3>Preview Hasil:</h3>
<textarea id="hasil" readonly></textarea>

<script>
let hasilData = [];

const kamusKreatif = {
  pembuka: ["Kenapa Harus Ragu Lagi?","Ini Dia Solusi Sehatmu!","Yuk, Mulai Hidup Sehat!","Percaya Khasiat Alami?","Waktunya Beralih ke Alami!"],
  promo: ["Gratis Sample Produk","Diskon Spesial Akhir Pekan","Extra Diskon 10%","Promo Buy 1 Get 1","Harga Coret Spesial"],
  closing: ["Konsultasi","Tanya","Coba","Pesan","Dapatkan"]
};

function rekomendasi(jenis) {
  const ta = document.getElementById(jenis);
  const existing = ta.value.trim().split('\n').filter(x=>x);
  const pool = kamusKreatif[jenis].filter(k=>!existing.includes(k));
  if (pool.length===0){ alert('Kamus sudah habis!'); return; }
  const tambahan = pool.sort(()=>Math.random()-0.5).slice(0,5);
  ta.value = existing.concat(tambahan).join('\n');
}

function acakAmbil(arr, n) {
  return [...arr].sort(()=>Math.random()-0.5).slice(0, n);
}

function generate() {
  const pembuka = document.getElementById('pembuka').value.trim().split('\n').filter(x=>x);
  const promo = document.getElementById('promo').value.trim().split('\n').filter(x=>x);
  const closing = document.getElementById('closing').value.trim().split('\n').filter(x=>x);
  const keywordMod = document.getElementById('keywordMod').value.trim().split('\n').filter(x=>x);
  const lokasi = document.getElementById('lokasi').value.trim().split('\n').filter(x=>x);
  const nomor = document.getElementById('nomor').value;
  const produk = document.getElementById('namaProduk').value.trim();
  let jumlah = parseInt(document.getElementById('jumlah').value);

  if (!produk || pembuka.length===0 || promo.length===0 || closing.length===0 || keywordMod.length<3 || lokasi.length<2) {
    alert('Pastikan semua bank kata terisi (minimal 3 keyword, 2 lokasi)!');
    return;
  }

  const total = pembuka.length * promo.length * closing.length;
  if (jumlah > total) { jumlah = total; }

  const progressBar = document.getElementById('progressBar');
  const statusText = document.getElementById('statusText');
  progressBar.style.display = 'block';
  progressBar.value = 0;

  let indexArray = Array.from({length: total}, (_, i) => i);
  for (let i = indexArray.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [indexArray[i], indexArray[j]] = [indexArray[j], indexArray[i]];
  }
  const dipilih = indexArray.slice(0, jumlah);
  hasilData = [];
  let idx = 0;
  const batchSize = 30;

  function prosesBatch() {
    const batasAkhir = Math.min(idx + batchSize, dipilih.length);
    for (; idx < batasAkhir; idx++) {
      const id = dipilih[idx];
      const k = id % closing.length;
      let sisa = Math.floor(id / closing.length);
      const j = sisa % promo.length;
      const i = Math.floor(sisa / promo.length);

      const kalimat = `${pembuka[i]} ${nomor} ${promo[j]} ${closing[k]} ${produk}`;

      const jumlahLokasi = Math.min(5, lokasi.length);
      const lokasiTerpilih = acakAmbil(lokasi, jumlahLokasi);

      const kw = lokasiTerpilih.map(lok => {
        const mod = keywordMod[Math.floor(Math.random() * keywordMod.length)];
        return `${produk} ${mod} di ${lok}`.toLowerCase();
      });

      const tagFromKw = kw.map(k => `#${k.replace(/\s+/g,'')}`);
      const tagProduk = `#${produk.replace(/\s+/g,'')}`;
      const hashtagFinal = [tagProduk, ...tagFromKw].join(' ');

      hasilData.push({
        kalimat: kalimat,
        hashtag: hashtagFinal,
        keyword: kw.join(', ')
      });
    }
    const persen = Math.round((idx / dipilih.length) * 100);
    progressBar.value = persen;
    statusText.textContent = `Memproses... ${idx}/${dipilih.length} (${persen}%)`;
    if (idx < dipilih.length) {
      setTimeout(prosesBatch, 10);
    } else {
      tampilkanPreview();
      statusText.textContent = `Selesai! ${dipilih.length} baris data siap diexport.`;
      setTimeout(()=>{ progressBar.style.display='none'; }, 1500);
    }
  }
  prosesBatch();
}

function tampilkanPreview() {
  const preview = hasilData.map((row, i) =>
    `${i+1}. Kalimat: ${row.kalimat}\n   Hashtag: ${row.hashtag}\n   Keyword: ${row.keyword}\n`
  ).join('\n');
  document.getElementById('hasil').value = preview;
}

function escapeHtml(text) {
  return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function unduhExcel() {
  if (hasilData.length === 0) { alert('Generate dulu ya!'); return; }
  const produk = document.getElementById('namaProduk').value.trim().replace(/\s+/g,'_');

  let table = '<table border="1"><tr><th>Kalimat</th><th>Hashtag</th><th>Keyword</th></tr>';
  hasilData.forEach(row => {
    table += `<tr><td>${escapeHtml(row.kalimat)}</td><td>${escapeHtml(row.hashtag)}</td><td>${escapeHtml(row.keyword)}</td></tr>`;
  });
  table += '</table>';

  const blob = new Blob(['\ufeff', table], { type: 'application/vnd.ms-excel' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `promo_${produk}.xls`;
  a.click();
  URL.revokeObjectURL(url);
}

function unduhTxt() {
  const teks = document.getElementById('hasil').value;
  if (!teks) { alert('Generate dulu ya!'); return; }
  const produk = document.getElementById('namaProduk').value.trim().replace(/\s+/g,'_');
  const blob = new Blob([teks], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `kalimat_promo_${produk}.txt`;
  a.click();
  URL.revokeObjectURL(url);
}
</script>
</body>
</html>
