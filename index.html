<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Generator Kalimat Promo Produk</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 850px; margin: 20px auto; padding: 10px; }
  textarea { width: 100%; height: 140px; font-family: monospace; margin-bottom: 5px; }
  input, button { padding: 8px 14px; margin: 5px 5px 5px 0; cursor: pointer; }
  #hasil { width: 100%; height: 280px; }
  label { font-weight: bold; display: block; margin-top: 10px; }
  progress { width: 100%; height: 18px; margin: 8px 0; }
  .btn-ai { background: #6c5ce7; color: white; border: none; border-radius: 4px; }
  .btn-generate { background: #00b894; color: white; border: none; border-radius: 4px; }
  .btn-download { background: #0984e3; color: white; border: none; border-radius: 4px; }
  #statusText { font-size: 13px; color: #555; }
  .info-text { font-size: 12px; color: #888; font-weight: normal; }
</style>
</head>
<body>

<h2>Generator Kalimat Promo Produk</h2>

<label>Nama Produk <span class="info-text">(akan otomatis ditambahkan di akhir tiap kalimat)</span></label>
<input type="text" id="namaProduk" value="Susu Kambing" style="width: 100%; box-sizing: border-box;">

<label>Bank Kata Pembuka</label>
<textarea id="pembuka">Ingin Lebih Sehat?
Yuk, Ikuti Sunnah Rosul!
Rasakan Khasiatnya!
Sudah Coba Yang Murni?
Jaga Imun Secara Alami!
Waktunya Hidup Berkualitas!
Bikin Tubuh Makin Bugar!
Warisan Nabi yang Menyehatkan!
Baru Kenal Manfaatnya?
Saatnya Rasakan Kesegarannya!</textarea>
<button class="btn-ai" onclick="rekomendasi('pembuka')">✨ Rekomendasi Kreatif</button>

<label>Bank Kata Promo</label>
<textarea id="promo">Diskon 20%
Beli 2 Gratis 1
Cashback 15%
Harga Spesial Bulan Ini
Bonus Botol Kedua
Hemat Hingga 30 Ribu
Paket Hemat Keluarga
Voucher Belanja Rp10.000
Potongan Harga Member Baru
Bundling Hemat 2 Produk</textarea>
<button class="btn-ai" onclick="rekomendasi('promo')">✨ Rekomendasi Kreatif</button>

<label>Bank Kata Closing <span class="info-text">(jangan sertakan nama produk, otomatis ditambahkan)</span></label>
<textarea id="closing">Lagi Cari
Paket
Yang Jual
Order
Stok
Cari Yang Asli
Langganan
Info
Beli
Cek</textarea>
<button class="btn-ai" onclick="rekomendasi('closing')">✨ Rekomendasi Kreatif</button>

<label>Nomor HP</label>
<input type="text" id="nomor" value="08141-3333-512">

<label>Jumlah Kalimat</label>
<input type="number" id="jumlah" value="100">

<br>
<button class="btn-generate" onclick="generate()">🚀 Generate Kalimat</button>
<button class="btn-download" onclick="unduh()">⬇ Download .txt</button>

<progress id="progressBar" value="0" max="100" style="display:none;"></progress>
<div id="statusText"></div>

<h3>Hasil:</h3>
<textarea id="hasil" readonly></textarea>

<script>
const kamusKreatif = {
  pembuka: [
    "Kenapa Harus Ragu Lagi?", "Ini Dia Solusi Sehatmu!", "Yuk, Mulai Hidup Sehat!",
    "Percaya Khasiat Alami?", "Waktunya Beralih ke Alami!", "Sudah Siap Lebih Bugar?",
    "Ini Rahasia Sehat Keluarga!", "Yuk, Coba Sekarang Juga!", "Sehatmu Prioritas Kami!",
    "Jangan Tunda Hidup Sehat!", "Mau Tubuh Lebih Fit?", "Sehat Dimulai Dari Sini!",
    "Yuk, Perbaiki Pola Hidup!", "Kenali Manfaat Alaminya!", "Waktunya Berubah Jadi Sehat!"
  ],
  promo: [
    "Gratis Sample Produk", "Diskon Spesial Akhir Pekan", "Extra Diskon 10%",
    "Promo Buy 1 Get 1", "Harga Coret Spesial", "Gratis Merchandise Menarik",
    "Diskon Member Eksklusif", "Paket Combo Hemat", "Cashback Hingga 25rb",
    "Diskon Awal Bulan", "Promo Serba 15 Ribu", "Diskon Kejutan Hari Ini",
    "Gratis Ongkir Area Tertentu", "Harga Grosir Terbatas", "Diskon Loyalitas Pelanggan"
  ],
  closing: [
    "Konsultasi", "Tanya", "Coba", "Pesan", "Dapatkan", "Rekomendasi",
    "Testimoni", "Referensi", "Jaminan", "Kualitas", "Manfaat", "Khasiat",
    "Keunggulan", "Kesegaran", "Kemurnian"
  ]
};

function rekomendasi(jenis) {
  const textarea = document.getElementById(jenis);
  const existing = textarea.value.trim().split('\n').filter(x => x);
  const pool = kamusKreatif[jenis].filter(k => !existing.includes(k));

  if (pool.length === 0) {
    alert('Kamus kreatif untuk kategori ini sudah habis dipakai semua!');
    return;
  }

  const shuffled = pool.sort(() => Math.random() - 0.5);
  const tambahan = shuffled.slice(0, Math.min(5, pool.length));

  textarea.value = existing.concat(tambahan).join('\n');
  alert('Ditambahkan ' + tambahan.length + ' kata baru: \n' + tambahan.join('\n'));
}

function generate() {
  const pembuka = document.getElementById('pembuka').value.trim().split('\n').filter(x => x);
  const promo = document.getElementById('promo').value.trim().split('\n').filter(x => x);
  const closing = document.getElementById('closing').value.trim().split('\n').filter(x => x);
  const nomor = document.getElementById('nomor').value;
  const namaProduk = document.getElementById('namaProduk').value.trim();
  let jumlah = parseInt(document.getElementById('jumlah').value);

  if (pembuka.length === 0 || promo.length === 0 || closing.length === 0) {
    alert('Semua bank kata harus diisi minimal 1 baris!');
    return;
  }

  if (namaProduk === '') {
    alert('Nama produk tidak boleh kosong!');
    return;
  }

  const total = pembuka.length * promo.length * closing.length;
  if (jumlah > total) {
    alert('Total kombinasi unik cuma ' + total + '. Ditampilkan semua (' + total + ' kalimat).');
    jumlah = total;
  }

  const progressBar = document.getElementById('progressBar');
  const statusText = document.getElementById('statusText');
  progressBar.style.display = 'block';
  progressBar.value = 0;
  statusText.textContent = 'Memulai proses...';

  let indexArray = Array.from({length: total}, (_, i) => i);
  for (let i = indexArray.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [indexArray[i], indexArray[j]] = [indexArray[j], indexArray[i]];
  }

  const dipilih = indexArray.slice(0, jumlah);
  const hasilKalimat = [];

  let idx = 0;
  const batchSize = 50;

  function prosesBatch() {
    const batasAkhir = Math.min(idx + batchSize, dipilih.length);

    for (; idx < batasAkhir; idx++) {
      const id = dipilih[idx];
      const k = id % closing.length;
      let sisa = Math.floor(id / closing.length);
      const j = sisa % promo.length;
      const i = Math.floor(sisa / promo.length);

      hasilKalimat.push(`${pembuka[i]} ${nomor} ${promo[j]} ${closing[k]} ${namaProduk}`);
    }

    const persen = Math.round((idx / dipilih.length) * 100);
    progressBar.value = persen;
    statusText.textContent = `Memproses... ${idx}/${dipilih.length} kalimat (${persen}%)`;

    if (idx < dipilih.length) {
      setTimeout(prosesBatch, 10);
    } else {
      document.getElementById('hasil').value = hasilKalimat.join('\n');
      statusText.textContent = `Selesai! ${hasilKalimat.length} kalimat unik berhasil dibuat.`;
      setTimeout(() => { progressBar.style.display = 'none'; }, 1500);
    }
  }

  prosesBatch();
}

function unduh() {
  const teks = document.getElementById('hasil').value;
  if (!teks) { alert('Generate kalimat dulu ya!'); return; }
  const namaProduk = document.getElementById('namaProduk').value.trim().replace(/\s+/g, '_');
  const blob = new Blob([teks], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `kalimat_promo_${namaProduk}.txt`;
  a.click();
  URL.revokeObjectURL(url);
}
</script>

</body>
</html>
