<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Generator Kalimat Promo Susu Kambing</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 800px; margin: 20px auto; padding: 10px; }
  textarea { width: 100%; height: 120px; margin-bottom: 10px; }
  input, button { padding: 8px; margin: 5px 0; }
  #hasil { width: 100%; height: 300px; }
  label { font-weight: bold; }
</style>
</head>
<body>

<h2>Generator Kalimat Promo (Anti Perulangan)</h2>

<label>Bank Kata Pembuka (satu per baris):</label>
<textarea id="pembuka">Ingin Lebih Sehat?
Yuk, Ikuti Sunnah Rosul!
Rasakan Khasiatnya!
Sudah Coba Yang Murni?
Jaga Imun Secara Alami!
Waktunya Hidup Berkualitas!
Bikin Tubuh Makin Bugar!
Warisan Nabi yang Menyehatkan!
Baru Kenal Manfaatnya?
Saatnya Rasakan Kesegarannya!</textarea>

<label>Bank Kata Promo (satu per baris):</label>
<textarea id="promo">Diskon 20%
Beli 2 Gratis 1
Cashback 15%
Harga Spesial Bulan Ini
Bonus Botol Kedua
Hemat Hingga 30 Ribu
Paket Hemat Keluarga
Voucher Belanja Rp10.000
Potongan Harga Member Baru
Bundling Hemat 2 Produk</textarea>

<label>Bank Kata Closing (satu per baris):</label>
<textarea id="closing">Lagi Cari Susu Kambing
Paket Susu Kambing
Yang Jual Susu Kambing
Order Susu Kambing
Stok Susu Kambing
Cari Susu Kambing Asli
Langganan Susu Kambing
Info Susu Kambing
Beli Susu Kambing
Cek Susu Kambing</textarea>

<label>Nomor HP:</label><br>
<input type="text" id="nomor" value="08141-3333-512"><br>

<label>Jumlah Kalimat Diinginkan:</label><br>
<input type="number" id="jumlah" value="100"><br>

<button onclick="generate()">Generate Kalimat</button>
<button onclick="unduh()">Download .txt</button>

<h3>Hasil:</h3>
<textarea id="hasil" readonly></textarea>

<script>
function generate() {
  const pembuka = document.getElementById('pembuka').value.trim().split('\n').filter(x => x);
  const promo = document.getElementById('promo').value.trim().split('\n').filter(x => x);
  const closing = document.getElementById('closing').value.trim().split('\n').filter(x => x);
  const nomor = document.getElementById('nomor').value;
  let jumlah = parseInt(document.getElementById('jumlah').value);

  const total = pembuka.length * promo.length * closing.length;

  if (jumlah > total) {
    alert('Total kombinasi unik cuma ' + total + '. Tambah isi bank kata biar bisa lebih banyak. Sementara ditampilkan semua yang tersedia (' + total + ' kalimat).');
    jumlah = total;
  }

  // Buat array berisi semua kemungkinan index (0 sampai total-1)
  let indexArray = Array.from({length: total}, (_, i) => i);

  // Fisher-Yates Shuffle: teknik mengacak array secara merata (fair)
  for (let i = indexArray.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [indexArray[i], indexArray[j]] = [indexArray[j], indexArray[i]];
  }

  // Ambil sejumlah 'jumlah' index pertama dari hasil acakan (dijamin tidak ada duplikat)
  const dipilih = indexArray.slice(0, jumlah);

  const hasilKalimat = dipilih.map(idx => {
    // Decode index tunggal jadi 3 index (i, j, k) menggunakan pembagian & modulo
    const k = idx % closing.length;
    let sisa = Math.floor(idx / closing.length);
    const j = sisa % promo.length;
    const i = Math.floor(sisa / promo.length);

    return `${pembuka[i]} ${nomor} ${promo[j]} ${closing[k]} Susu Kambing`;
  });

  document.getElementById('hasil').value = hasilKalimat.join('\n');
}

function unduh() {
  const teks = document.getElementById('hasil').value;
  if (!teks) { alert('Generate kalimat dulu ya!'); return; }
  const blob = new Blob([teks], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'kalimat_promo.txt';
  a.click();
  URL.revokeObjectURL(url);
}
</script>

</body>
</html>
